name: Deploy Bowling Tracker to GitHub Pages

# One workflow for main. tests.yml used to run in parallel with this on
# every push, so a single commit paid for THREE npm installs, TWO full
# test runs and TWO builds -- roughly half the work duplicated.
#
# Pull requests still get tested (see the pr job below); they just don't
# build or deploy, because there's nothing to deploy from a PR.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Action majors are pinned to the Node 24 releases.
#
# GitHub is removing Node 20 from the runners on 23 September 2026, and
# already forces Node 24 by default. The warning named
# actions/upload-artifact@v4, which this workflow never calls directly --
# upload-pages-artifact pulls it in, so the fix is bumping the wrapper,
# not adding a reference to the thing named in the message.
#
# checkout@v5 and setup-node@v5 are already Node 24 and are left alone.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Test and build in ONE job.
  #
  # They were separate jobs, and separate jobs don't share a filesystem --
  # so the build job had to check out and `npm ci` all over again. Same
  # runner means one install serves both, and dist/ is already there when
  # the artifact is uploaded.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --prefer-offline

      - name: Run tests
        run: npm test

      - name: Data-flow audit
        # Runs from wherever the file lives -- these moved to scripts/
        # partway through and two builds failed on the path rather than
        # on anything the audit found. Fails loudly if it is in neither
        # place, so a missing audit can never look like a passing one.
        run: |
          if   [ -f scripts/audit_dataflow.mjs ]; then node scripts/audit_dataflow.mjs
          elif [ -f audit_dataflow.mjs ];         then node audit_dataflow.mjs
          else echo "audit_dataflow.mjs not found in scripts/ or the repo root"; exit 1
          fi

      - name: Schema audit
        # Runs from wherever the file lives -- these moved to scripts/
        # partway through and two builds failed on the path rather than
        # on anything the audit found. Fails loudly if it is in neither
        # place, so a missing audit can never look like a passing one.
        run: |
          if   [ -f scripts/audit_live_schema.mjs ]; then node scripts/audit_live_schema.mjs
          elif [ -f audit_live_schema.mjs ];         then node audit_live_schema.mjs
          else echo "audit_live_schema.mjs not found in scripts/ or the repo root"; exit 1
          fi

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # Pages steps are skipped on pull requests: a PR has nowhere to
      # deploy to, and running them would fail on permissions.
      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
